name: CI - Testing

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-policy:
    name: Testing / Promotion Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require promotion from develop
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "develop" ]]; then
            echo "Pull requests to testing must originate from develop."
            exit 1
          fi

  linux-quality:
    name: Testing / Linux Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate repository syntax
        run: make syntax

      - name: Lint shell scripts
        run: make lint

      - name: Restore dependencies
        run: dotnet restore Calcufolio.slnx

      - name: Verify formatting
        run: dotnet format Calcufolio.slnx --verify-no-changes --no-restore

      - name: Build solution in Release
        run: dotnet build Calcufolio.slnx --configuration Release --no-restore

      - name: Run automated tests in Release
        run: >-
          dotnet test
          --solution Calcufolio.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Audit NuGet dependencies
        run: make audit

  cross-platform:
    name: Testing / Cross-platform Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Calcufolio.slnx

      - name: Build solution in Release
        run: dotnet build Calcufolio.slnx --configuration Release --no-restore

      - name: Run automated tests in Release
        run: >-
          dotnet test
          --solution Calcufolio.slnx
          --configuration Release
          --no-build
          --no-restore

  required:
    name: Testing / Required
    if: always()
    runs-on: ubuntu-latest
    needs:
      - promotion-policy
      - linux-quality
      - cross-platform

    steps:
      - name: Verify required jobs
        env:
          PROMOTION_RESULT: ${{ needs.promotion-policy.result }}
          LINUX_RESULT: ${{ needs.linux-quality.result }}
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform.result }}
        run: |
          printf 'Promotion policy: %s\n' "$PROMOTION_RESULT"
          printf 'Linux quality: %s\n' "$LINUX_RESULT"
          printf 'Cross-platform: %s\n' "$CROSS_PLATFORM_RESULT"

          [[ "$PROMOTION_RESULT" == "success" ]]
          [[ "$LINUX_RESULT" == "success" ]]
          [[ "$CROSS_PLATFORM_RESULT" == "success" ]]
