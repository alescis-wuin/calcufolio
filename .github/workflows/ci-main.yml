name: CI - Main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-policy:
    name: Main / Promotion Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require promotion from testing
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "testing" ]]; then
            echo "Pull requests to main must originate from testing."
            exit 1
          fi

  release-validation:
    name: Main / Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate repository syntax
        run: make syntax

      - name: Lint shell scripts
        run: make lint

      - name: Restore dependencies
        run: dotnet restore Calcufolio.slnx

      - name: Verify formatting
        run: dotnet format Calcufolio.slnx --verify-no-changes --no-restore

      - name: Build solution in Release
        run: dotnet build Calcufolio.slnx --configuration Release --no-restore

      - name: Run automated tests in Release
        run: >-
          dotnet test
          --solution Calcufolio.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Audit NuGet dependencies
        run: make audit

      - name: Publish desktop application
        run: >-
          dotnet publish
          src/Calcufolio.Presentation/Calcufolio.Presentation.csproj
          --configuration Release
          --no-restore
          --output artifacts/publish

      - name: Verify publish output
        run: |
          test -d artifacts/publish
          test -n "$(find artifacts/publish -maxdepth 1 -type f -print -quit)"

  required:
    name: Main / Required
    if: always()
    runs-on: ubuntu-latest
    needs:
      - promotion-policy
      - release-validation

    steps:
      - name: Verify required jobs
        env:
          PROMOTION_RESULT: ${{ needs.promotion-policy.result }}
          RELEASE_RESULT: ${{ needs.release-validation.result }}
        run: |
          printf 'Promotion policy: %s\n' "$PROMOTION_RESULT"
          printf 'Release validation: %s\n' "$RELEASE_RESULT"

          [[ "$PROMOTION_RESULT" == "success" ]]
          [[ "$RELEASE_RESULT" == "success" ]]
